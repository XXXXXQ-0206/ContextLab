[workspace]
resolver = "3"
members = [
  "crates/auth",
  "crates/context-core",
  "crates/versioning",
  "crates/diff-engine",
  "crates/embedding",
  "crates/evaluation",
  "crates/graph",
  "crates/knowledge",
  "crates/memory",
  "crates/mcp",
  "crates/model-gateway",
  "crates/plugin-runtime",
  "crates/storage",
  "crates/workflow",
  "apps/cli",
  "apps/cli/crates/contextlab-adapter-contract",
  "apps/desktop/src-tauri",
  "server/api",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
authors = ["ContextLab Contributors"]

[workspace.dependencies]
async-trait = "0.1.89"
axum = "0.8.4"
chrono = { version = "0.4.39", default-features = false, features = ["clock", "serde"] }
dotenvy = "0.15.7"
http-body-util = "0.1.2"
jsonwebtoken = { version = "9.3.1", default-features = false }
reqwest = { version = "0.12.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }
thiserror = "2.0.11"
tokio = { version = "1.43.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5.2", features = ["util"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
url = { version = "2.5.4", features = ["serde"] }
uuid = { version = "1.11.0", features = ["serde", "v4", "v5"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
